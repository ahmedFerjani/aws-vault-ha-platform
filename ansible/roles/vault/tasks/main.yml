---
- name: Validate pinned Vault RPM inputs
  ansible.builtin.assert:
    that:
      - vault_version is defined
      - vault_version | length > 0
      - vault_package_release is defined
      - vault_package_release | length > 0
    fail_msg: Set the pinned Vault version and RPM release.

- name: Configure HashiCorp stable RPM repository for Amazon Linux
  ansible.builtin.yum_repository:
    name: hashicorp
    description: HashiCorp Stable - $basearch
    baseurl: https://rpm.releases.hashicorp.com/AmazonLinux/latest/$basearch/stable
    enabled: true
    gpgcheck: true
    gpgkey: "{{ vault_rpm_gpg_key_url }}"

- name: Install the pinned Vault RPM using repository GPG verification
  ansible.builtin.dnf:
    name: "vault-{{ vault_version }}-{{ vault_package_release }}"
    state: present
    update_cache: true
    disable_gpg_check: false

- name: Create Vault group
  ansible.builtin.group:
    name: "{{ vault_group }}"
    system: true
    state: present

- name: Create non-login Vault service user
  ansible.builtin.user:
    name: "{{ vault_user }}"
    group: "{{ vault_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Create Vault configuration, data, and package cache directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/vault.d
      owner: root
      group: "{{ vault_group }}"
      mode: "0750"
    - path: /opt/vault
      owner: root
      group: "{{ vault_group }}"
      mode: "0750"
    - path: /opt/vault/data
      owner: "{{ vault_user }}"
      group: "{{ vault_group }}"
      mode: "0700"

- name: Check local TLS certificate and key sources
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  delegate_to: localhost
  become: false
  loop:
    - "{{ vault_tls_cert_src }}"
    - "{{ vault_tls_key_src }}"
  register: vault_tls_source_stats

- name: Require local TLS certificate and key files
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: Required TLS source file is missing or not a regular file.
  loop: "{{ vault_tls_source_stats.results }}"

- name: Create restrictive Vault TLS directory
  ansible.builtin.file:
    path: /opt/vault/tls
    state: directory
    owner: root
    group: "{{ vault_group }}"
    mode: "0750"

- name: Install Vault TLS certificate chain
  ansible.builtin.copy:
    src: "{{ vault_tls_cert_src }}"
    dest: "{{ vault_tls_cert_file }}"
    local_follow: true
    owner: root
    group: "{{ vault_group }}"
    mode: "0640"

- name: Install Vault TLS private key
  ansible.builtin.copy:
    src: "{{ vault_tls_key_src }}"
    dest: "{{ vault_tls_key_file }}"
    local_follow: true
    owner: root
    group: "{{ vault_group }}"
    mode: "0640"
  no_log: true

- name: Configure Vault server settings
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: root
    group: "{{ vault_group }}"
    mode: "0640"

- name: Keep Vault stopped and disabled until TLS and Raft bootstrap are ready
  ansible.builtin.systemd_service:
    name: vault.service
    state: stopped
    enabled: false
