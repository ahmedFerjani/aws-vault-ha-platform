---
- name: Create Vault group
  ansible.builtin.group:
    name: "{{ service_group }}"
    system: true
    state: present

- name: Create non-login Vault service user
  ansible.builtin.user:
    name: "{{ service_user }}"
    group: "{{ service_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    state: present

- name: Create Vault configuration, data, and package cache directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/vault.d
      owner: root
      group: "{{ service_group }}"
      mode: "0750"
    - path: /opt/vault
      owner: root
      group: "{{ service_group }}"
      mode: "0750"
    - path: /opt/vault/data
      owner: "{{ service_user }}"
      group: "{{ service_group }}"
      mode: "0700"